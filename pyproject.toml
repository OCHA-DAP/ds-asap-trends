[project]
name = "ds-asap-trends"
version = "0.1.0"
description = "Trends in the JRC ASAP agricultural-drought indicators behind ASAP warnings"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "marimo>=0.10",
    "matplotlib>=3.9",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
